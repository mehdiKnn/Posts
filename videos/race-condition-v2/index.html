<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race condition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Handlee&display=block" rel="stylesheet">
<link rel="stylesheet" href="../../lib/stage.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="voix-align.js"></script>
<script src="../../charte/signature.js"></script>
<script src="../../lib/stage.js"></script>
<script src="../../lib/dispositifs/collision.js"></script>
</head>
<body>
<div id="stage">
  <div id="cam">
    <div id="titre">Race condition</div>
    <svg viewBox="0 0 1080 1920"><path id="souligne" class="trait bleu" d="M300 386 C420 378 620 392 782 382"/></svg>
    <div id="schema"></div>
    <div id="mot"><i></i><span>verrou</span></div>

    <div id="taupe">
      <img data-pose="neutre" src="../../mascottes/taupe/sprites/neutre.png" alt="">
      <img data-pose="pointe-fermee" src="../../mascottes/taupe/sprites/pointe-fermee.png" alt="">
      <img data-pose="pointe-ouverte" src="../../mascottes/taupe/sprites/pointe-ouverte.png" alt="">
    </div>
  </div>
  <div id="st"><span></span></div>
  <div id="signature"><div class="nom"></div><div class="accroche"></div></div>
</div>
<div id="play">▶ Cliquer pour lancer (avec le son)</div>
<audio id="vo" src="voix.mp3" preload="auto"></audio>

<script>
// Le sujet s'écrit sur la feuille.
ecrit('#titre', 0.2)
trace($('#souligne'), 0.95, 0.45)
son('feutre', 0.95)

// Le dispositif : la collision, puis le verrou. Les mots sont ceux de la voix.
Collision.monter({ lecture: '1 place', fin: 'complet' })
Collision.anime({
  objet: 'Il reste', gauche: 'Alice', droite: 'Bob', clic: 'cliquent', lecture: 'voient', action: 'achètent',
  controle: 'vérifie', doublon: 'Deux billets', reset: R[2].debut,
  verrou: 'verrou', gagnant: 'Alice achète', attend: 'Bob attend', fin: 'complet',
})

// À retenir : le mot-clé, surligné, sous la baguette.
const tMot = cue('verrou')
ecrit('#mot', tMot - 0.1, 0.45)
tl.to('#mot i', { scaleX: 1, duration: 0.35, ease: 'power1.inOut' }, tMot + 0.3)
son('feutre', tMot - 0.1)
window.COUVERTURE = tMot + 0.8  // l'image de couverture : le titre, le schéma complet, le mot à retenir

signature()
finir()
mascotte({ qui: 'taupe', parle: 'pointe', ecoute: 'neutre' })
sousTitres()
demarrer()
</script>
</body>
</html>
