<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadlock</title>
<!-- DA Manar Studio : les jetons, les polices et le trait viennent de lib/manar.css et lib/manar.js. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&family=Caveat:wght@600&display=block" rel="stylesheet">
<link rel="stylesheet" href="../../lib/stage.css">
<link rel="stylesheet" href="../../lib/manar.css">
<style>
  /* Le nom français du sujet, en annotation manuscrite sous le titre. */
  #interbloc{position:absolute;left:0;right:0;top:404px;text-align:center;font:600 66px/1 var(--note-m);clip-path:inset(0 100% 0 0)}
  #st{opacity:0}  /* caché sur la première image seulement (voir la fin du script) */
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="voix-align.js"></script>
<script src="../../charte/signature.js"></script>
<script src="../../lib/stage.js"></script>
<script src="../../lib/dispositifs/croisement.js"></script>
</head>
<body>
<script src="../../lib/manar.js"></script>
<div id="stage">
  <div id="cam">
    <div id="titre">Deadlock</div>
    <svg viewBox="0 0 1080 1920"><path id="souligne" class="trait" d="M300 398 C420 388 640 404 780 392"/></svg>
    <div id="interbloc">(interblocage)</div>
    <div id="schema"></div>

    <div id="mascotte">
      <img data-pose="neutre" alt="">
      <img data-pose="pointe" alt="">
    </div>
  </div>
  <div id="st"><span></span></div>
  <div id="signature"><div class="nom"></div><div class="accroche"></div></div>
</div>
<div id="play">▶ Cliquer pour lancer (avec le son)</div>
<audio id="vo" src="voix.mp3" preload="auto"></audio>

<script>
// Rien ne bouge avant que la mascotte parle : le sujet s'écrit sur son premier mot, se souligne d'un trait de pinceau, puis son nom
// français, plus petit.
ecrit('#titre', R[1].debut, 0.5)
trace($('#souligne'), R[1].debut + 0.6, 0.4)
son('feutre', R[1].debut + 0.6)
ecrit('#interbloc', R[1].debut + 1.1, 0.5)
son('feutre', R[1].debut + 1.1)

// Le dispositif : deux virements croisés, puis le même ordre pour tous. Les mots sont ceux de la voix.
Croisement.monter({ a: 'A', b: 'B' })
Croisement.anime({
  cadenas: 'verrous peuvent', gauche: 'Alice vire', droite: 'Bob à Alice', tend: 'en même temps',
  prendA: 'Alice verrouille', prendB: 'Bob le compte B', demande: 'chacun demande',
  boucle: 'Personne ne lâche', pulse: 'pour toujours', reset: R[2].debut,
  ordre: 'le même ordre', soloA: 'le compte A', soloB: 'puis le B', vides: 'Bob attend',
  finit: 'Alice finit', passe: 'Bob passe', relache: 'Même ordre', tous: 'pour tous', contour: 'plus de cycle',
})
window.COUVERTURE = R[1].fin  // la boucle fermée, sur le schéma complet du deadlock

carteDeFin('taupe')
signature()
tl.set('#interbloc', { opacity: 0 }, window.SIGNATURE_DEBUT)  // la feuille se vide aussi de la ligne sous le titre
finir()
// La boucle : l'export prend ses images de 0 à durée − 1/30 s ; quelques images de feuille vide après l'effacement de la
// signature, pour que la dernière soit celle de la première.
tl.set({}, {}, tl.duration() + 0.2)
// Sans sous-titre sur la première image, comme sur la dernière : le premier arrive une image plus tard.
tl.set('#st', { opacity: 1 }, 1 / 30)
mascotte({ qui: 'taupe', parle: 'pointe', ecoute: 'neutre' })
sousTitres()
// Les polices de la DA Manar sont chargées (et vérifiées) avant que la page se déclare prête pour les captures.
const POLICES = ['800 124px "Bricolage Grotesque"', '600 52px "DM Sans"', '700 64px "DM Sans"', '600 66px "Caveat"']
Promise.all(POLICES.map(p => document.fonts.load(p, 'Deadlock (interblocage) AB')))
  .then(() => {
    const manquantes = POLICES.filter(p => !document.fonts.check(p, 'Deadlock'))
    if (manquantes.length) throw new Error('Polices non chargées : ' + manquantes.join(', '))
    window.POLICES_OK = true
    demarrer()
  })
</script>
</body>
</html>
