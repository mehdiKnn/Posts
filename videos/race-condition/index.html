<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race condition</title>
<!-- DA Manar Studio : les jetons, les polices et le trait viennent de lib/manar.css et lib/manar.js. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=DM+Sans:opsz,wght@9..40,500;9..40,600;9..40,700&family=Caveat:wght@600&display=block" rel="stylesheet">
<link rel="stylesheet" href="../../lib/stage.css">
<link rel="stylesheet" href="../../lib/manar.css">
<style>
/* Le mot à retenir, sous le schéma, au bout du bâton : encre sur un aplat de pinceau miel (la lumière). */
#mot{position:absolute;left:540px;translate:-50% 0;top:950px;font:800 100px/1 var(--police-titre);letter-spacing:-0.03em;
  padding:0 6px;clip-path:inset(0 100% 0 0)}
#mot span{position:relative;z-index:1}
#mot i{position:absolute;left:-14px;right:-14px;top:30%;bottom:-2%;background:var(--lumiere);
  border-radius:14px 6px 16px 5px/6px 15px 5px 14px;transform-origin:left;transform:scaleX(0)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="voix-align.js"></script>
<script src="../../charte/signature.js"></script>
<script src="../../lib/stage.js"></script>
<script src="../../lib/dispositifs/collision.js"></script>
</head>
<body>
<script src="../../lib/manar.js"></script>
<div id="stage">
  <div id="cam">
    <div id="titre">Race condition</div>
    <svg viewBox="0 0 1080 1920"><path id="souligne" class="trait" d="M150 404 C330 394 700 410 930 398"/></svg>
    <div id="schema"></div>
    <div id="mot"><i></i><span>verrou</span></div>

    <div id="taupe">
      <img data-pose="neutre" src="../../mascottes/taupe/sprites/neutre.png" alt="">
      <img data-pose="pointe-fermee" src="../../mascottes/taupe/sprites/pointe-fermee.png" alt="">
      <img data-pose="pointe-ouverte" src="../../mascottes/taupe/sprites/pointe-ouverte.png" alt="">
    </div>
  </div>
  <div id="st"><span></span></div>
  <div id="signature"><div class="nom"></div><div class="accroche"></div></div>
</div>
<div id="play">▶ Cliquer pour lancer (avec le son)</div>
<audio id="vo" src="voix.mp3" preload="auto"></audio>

<script>
// Le sujet s'écrit sur la feuille ; il se souligne au pinceau miel quand l'élève le nomme.
ecrit('#titre', 0.2)
const tSouligne = cue('race condition')
trace($('#souligne'), tSouligne, 0.5)
son('feutre', tSouligne)

// Le dispositif : la collision, puis le verrou. Les mots sont ceux de la voix, dans l'ordre du texte.
Collision.monter({ lecture: '1 place', fin: 'complet' })
Collision.anime({
  objet: 'Il reste', gauche: 'Alice', droite: 'Bob', clic: 'cliquent', lecture: 'voient', action: 'achètent',
  controle: 'vérifie', doublon: 'Deux billets', reset: R[2].debut,
  verrou: 'verrou', gagnant: 'Alice achète', attend: 'Bob attend', fin: 'complet',
})

// Les explications sans geste dans la brique : l'élément dont parle la voix se signale d'une pulsation, une seule fois
// (le bâton de la taupe est fixe). Ces mots tombent entre ceux de la brique : on reprend le texte depuis le début.
curseur = 0
const pulse = (els, t, origine = { transformOrigin: '50% 50%' }) =>
  tl.to(els, { scale: 1.12, duration: 0.25, ease: 'power1.out', yoyo: true, repeat: 1, ...origine }, t)
pulse('#fleche-b', cue("l'autre"))                                  // l'autre s'est glissé entre les deux
pulse('#choc', cue('Voilà'), { svgOrigin: '540 630' })              // voilà une race condition : la collision
pulse(['#fleche-a', '#fleche-b'], cue('qui passe'))                  // qui passe en premier : les deux flèches, ensemble
pulse('#verrou', cue('seul geste'))                                  // vérifier et vendre deviennent un seul geste
pulse('#billet', cue('Donnée'))                                      // donnée partagée : le billet
pulse(['#achat-a', '#attente-b'], cue('accès'))                      // accès simultané : les deux accès, ensemble

// À retenir : le mot s'écrit sous le schéma, puis le pinceau miel passe dessous.
const tMot = cue('verrou')
ecrit('#mot', tMot - 0.1, 0.45)
son('feutre', tMot - 0.1)
tl.to('#mot i', { scaleX: 1, duration: 0.35, ease: 'power1.inOut' }, tMot + 0.4)
// Les repères dans l'ordre de la voix : la planche se lit dans l'ordre, et les captures avancent comme l'export.
REPERES.sort((a, b) => a.t - b.t)
// L'image de couverture : le titre, le schéma complet (verrou, « complet »), le mot à retenir.
window.COUVERTURE = tMot + 0.9

signature()
finir()
mascotte({ qui: 'taupe', parle: 'pointe', ecoute: 'neutre' })
sousTitres()
// Les polices de la DA Manar sont chargées (et vérifiées) avant que la page se déclare prête pour les captures.
const POLICES = ['800 124px "Bricolage Grotesque"', '700 54px "DM Sans"', '600 52px "DM Sans"', '600 64px "Caveat"']
Promise.all(POLICES.map(p => document.fonts.load(p, 'Race condition 1 place complet verrou')))
  .then(() => {
    const manquantes = POLICES.filter(p => !document.fonts.check(p, 'Race'))
    if (manquantes.length) throw new Error('Polices non chargées : ' + manquantes.join(', '))
    window.POLICES_OK = true
    demarrer()
  })
</script>
</body>
</html>
