<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race condition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Handlee&display=block" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="voix-align.js"></script>
<style>
/* Charte : .claude/skills/video-courte/charte.md (palette « Feutres », Handlee, feuille à petits carreaux) */
:root{
  --feuille:#FBFBF8; --quadrillage:#A9C7E8; --encre:#1C1C21;
  --bleu:#2356D8; --rouge:#E2372C; --vert:#1E9C57;
  --main:'Handlee','Comic Sans MS',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--feuille)}
body{display:grid;place-items:center;min-height:100vh;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;flex:none;color:var(--encre);font-family:var(--main);
  background-color:var(--feuille);
  background-image:linear-gradient(var(--quadrillage) 2px,transparent 2px),linear-gradient(90deg,var(--quadrillage) 2px,transparent 2px);
  background-size:54px 54px;background-position:-1px -1px}
#cam{position:absolute;inset:0}
#play{display:none;position:fixed;inset:0;place-items:center;background:rgba(251,251,248,.85);font:28px var(--main);cursor:pointer;z-index:10}

#titre{position:absolute;left:0;right:0;top:248px;text-align:center;font-size:104px;line-height:1.1;clip-path:inset(0 100% 0 0)}
.ecran{position:absolute;width:176px;text-align:center;font-size:54px;line-height:1;opacity:0}
.ecran.vert{color:var(--vert)}

svg{position:absolute;inset:0;width:1080px;height:1920px;overflow:visible}
.trait{fill:none;stroke:var(--encre);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.bleu{stroke:var(--bleu)} .rouge{stroke:var(--rouge)} .vert{stroke:var(--vert)}
.cache{opacity:0}

/* Le schéma, agrandi et descendu ; la mascotte en bas à gauche, coupée par le bord gauche, laisse la place aux sous-titres. */
#schema{position:absolute;inset:0;transform-origin:540px 630px;transform:translateY(70px) scale(1.12)}
/* Carte de fin, commune à toutes les vidéos (charte/autocollants/) : après la voix, on invite à aimer et à s'abonner. */
#fin img,#fin .legende{position:absolute;opacity:0}
#fin .legende{width:360px;text-align:center;font-size:64px;line-height:1}
#mascotte{position:absolute;left:-290px;top:1048px;width:1000px;height:650px;transform-origin:50% 94%}
#mascotte img{position:absolute;inset:0;width:100%;height:100%;visibility:hidden}
/* Look autocollant : contour blanc épais et ombre douce qui le détache de la feuille (filtre #autocollant). */
.autocollant{filter:url(#autocollant)}
/* Sous-titres : hors de #cam, le tremblement ne les secoue pas. Bas de la zone sûre (y 1650), entre la mascotte (x 300)
   et le coin des boutons (x 900). */
#st{position:absolute;left:310px;right:180px;bottom:272px;text-align:center;font:76px/1.3 var(--main);color:var(--feuille);text-wrap:balance}
#st span{background:var(--encre);padding:2px 18px;border-radius:14px;-webkit-text-stroke:1.5px var(--feuille);-webkit-box-decoration-break:clone;box-decoration-break:clone}
#st span:empty{display:none}
</style>
</head>
<body>
<div id="stage">
  <svg width="0" height="0" style="position:absolute">
    <filter id="autocollant" x="-25%" y="-25%" width="150%" height="150%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="10" result="bord"/>
      <feFlood flood-color="#FFFFFF"/>
      <feComposite in2="bord" operator="in" result="blanc"/>
      <feMerge><feMergeNode in="blanc"/><feMergeNode in="SourceGraphic"/></feMerge>
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#1C1C21" flood-opacity=".25"/>
    </filter>
  </svg>
  <div id="cam">
    <div id="titre">Race condition</div>

    <svg viewBox="0 0 1080 1920"><path id="souligne" class="trait bleu" d="M300 386 C420 378 620 392 782 382"/></svg>

    <div id="schema">
    <svg viewBox="0 0 1080 1920">

      <!-- Téléphones d'Alice (gauche) et de Bob (droite) -->
      <image id="tel-a" class="autocollant cache" href="autocollants/telephone.png" x="140" y="450" width="210" height="401"/>
      <image id="tel-b" class="autocollant cache" href="autocollants/telephone.png" x="730" y="450" width="210" height="401"/>
      <!-- Les coches de la vérification, sous les téléphones : un trait ne touche pas un autocollant -->
      <path id="ok-a" class="trait vert" d="M215 908 L238 930 L278 886"/>
      <path id="ok-b" class="trait vert" d="M805 908 L828 930 L868 886"/>

      <!-- Le billet, et son double qui sort de derrière -->
      <image id="double" class="autocollant cache" href="autocollants/billet.png" x="475" y="588" width="130" height="84"/>
      <image id="billet" class="autocollant cache" href="autocollants/billet.png" x="475" y="588" width="130" height="84"/>

      <!-- Les deux achats, à 15 px de feuille au moins du contour des autocollants -->
      <g id="fleche-a"><path class="trait bleu" d="M377 630 H447"/><path class="trait bleu tete" d="M431 614 L449 630 L431 646"/></g>
      <g id="fleche-b"><path class="trait bleu" d="M703 630 H633"/><path class="trait bleu tete" d="M649 614 L631 630 L649 646"/></g>
      <g id="choc" class="cache">
        <path class="trait rouge" d="M540 548 V522"/><path class="trait rouge" d="M500 556 L486 536"/><path class="trait rouge" d="M580 556 L594 536"/>
        <path class="trait rouge" d="M540 712 V738"/><path class="trait rouge" d="M500 704 L486 724"/><path class="trait rouge" d="M580 704 L594 724"/>
      </g>

      <!-- La solution : le verrou, Alice passe, Bob attend -->
      <g id="verrou">
        <image id="cadenas-ouvert" class="autocollant cache" href="autocollants/cadenas-ouvert.png" x="492" y="422" width="96" height="162"/>
        <image id="cadenas-ferme" class="autocollant cache" href="autocollants/cadenas-ferme.png" x="492" y="422" width="96" height="162"/>
      </g>
      <g id="achat-a"><path class="trait vert" d="M377 630 H447"/><path class="trait vert tete" d="M431 614 L449 630 L431 646"/></g>
      <path id="attente-b" class="trait bleu cache" d="M703 630 H659" style="stroke-dasharray:12 12"/>
    </svg>

    <div class="ecran" id="place-a" style="left:157px;top:617px">1 place</div>
    <div class="ecran" id="place-b" style="left:747px;top:617px">1 place</div>
    <div class="ecran vert" id="complet" style="left:747px;top:617px">complet</div>
    </div>

    <div id="fin">
      <img id="coeur" class="autocollant" src="../../charte/autocollants/coeur.png" style="left:160px;top:780px;width:340px" alt="">
      <img id="abonne" class="autocollant" src="../../charte/autocollants/abonne.png" style="left:599px;top:780px;width:302px" alt="">
      <div class="legende autocollant" id="j-aime" style="left:150px;top:1126px">Like</div>
      <div class="legende autocollant" id="abonne-toi" style="left:570px;top:1126px">Abonne-toi</div>
    </div>

    <div id="mascotte" class="autocollant">
      <img data-pose="neutre" alt="">
      <img data-pose="pointe" alt="">
    </div>
  </div>
  <div id="st"><span></span></div>
</div>
<div id="play">▶ Cliquer pour lancer (avec le son)</div>
<audio id="vo" src="voix.mp3" preload="auto"></audio>

<script>
const $ = s => document.querySelector(s)
const $$ = s => [...document.querySelectorAll(s)]
const tl = gsap.timeline({ paused: true })
window.tl = tl

// Instant où la voix prononce `p` ; les repères se demandent dans l'ordre du texte.
let curseur = 0
window.REPERES = []  // chaque repère et son instant : les contrôles (render.mjs controle, verifier.mjs) les lisent
function cue(p) {
  const i = ALIGN.text.indexOf(p, curseur)
  if (i < 0) throw new Error('Repère introuvable dans la voix : ' + p)
  curseur = i + p.length
  REPERES.push({ mot: p, i, t: ALIGN.t[i] })
  return ALIGN.t[i]
}
const R = ALIGN.repliques  // 0 élève, 1 taupe (mécanisme), 2 élève (relance), 3 taupe (solution), 4 taupe (à retenir)

// La mascotte de la vidéo, la clé de sa voix dans voix.py (le « qui » de dialogue.json) : elle choisit ses sprites et sa voix
// de fin. Chaque mascotte garde ses réglages : les instants de « Like » et « abonne » dans sons/fin-<mascotte>.mp3
// (sons/generer.sh).
const MASCOTTE = 'taupe'
const VOIX_FIN = {
  taupe: { like: 0.4, abonne: 1.12, fin: 2.08 },
  cameleon: { like: 0.16, abonne: 1.04, fin: 1.92 },
}[MASCOTTE]
for (const i of $$('#mascotte img')) i.src = `../../mascottes/${MASCOTTE}/sprites/${i.dataset.pose}.png`

// Un trait se dessine comme au feutre.
// Bruitages, dosés : seuls les gestes qui font avancer l'histoire notent le leur (sons/<nom>.mp3) : un autocollant qui
// se colle, une flèche, un changement d'état, l'impact. render.mjs les mixe sous la voix.
window.SONS = []
const son = (nom, at, volume) => SONS.push({ nom, t: at, volume })
function trace(el, at, duree = 0.5) {
  const L = el.getTotalLength()
  // Le trou du pointillé dépasse le trait, sinon son bout arrondi laisse un point visible avant le tracé.
  gsap.set(el, { strokeDasharray: `${L} ${L + 20}`, strokeDashoffset: L + 10 })
  tl.to(el, { strokeDashoffset: 0, duration: duree, ease: 'power1.inOut' }, at)
}
const apparait = (el, at, d = 0.3) => tl.to(el, { opacity: 1, duration: d, ease: 'power1.out' }, at)
const disparait = (els, at, d = 0.35) => tl.to(els, { opacity: 0, duration: d, ease: 'power1.in' }, at)
const ecrit = (el, at, d = 0.7) => tl.to(el, { clipPath: 'inset(0 0% 0 0)', duration: d, ease: 'none' }, at)
// Un autocollant se pose : il arrive un peu grand et penché, puis se plaque sur la feuille.
const colle = (el, at) => (son('colle', at), tl.fromTo(el, { opacity: 0, scale: 1.25, rotation: -8, transformOrigin: '50% 50%' },
  { opacity: 1, scale: 1, rotation: 0, duration: 0.35, ease: 'back.out(2)', immediateRender: false }, at))
const tremble = at => (son('impact', at), tl.to('#cam', { keyframes: { x: [0, -14, 12, -8, 5, 0] }, duration: 0.4, ease: 'none' }, at))

// 1. Question : le sujet s'écrit sur la feuille.
ecrit('#titre', R[1].debut, 0.5)  // rien ne bouge pendant la question de l'élève
trace($('#souligne'), R[1].debut + 0.6, 0.4)

// 2. Mécanisme : le billet, les deux téléphones, la collision.
const tBillet = cue('une place')  // le billet, c'est la place : après le soulignement du titre
colle('#billet', tBillet)
for (const [g, mot] of [['#tel-a', 'Alice'], ['#tel-b', 'Bob']]) colle(g, cue(mot) - 0.1)
// Le clic : les deux téléphones pulsent ensemble (c'est l'objet qui se signale, aucun trait ne le touche).
const tClic = cue('cliquent')
tl.to(['#tel-a', '#tel-b'], { keyframes: { scale: [1, 1.08, 1] }, transformOrigin: '50% 50%', duration: 0.4, ease: 'power1.inOut' }, tClic)
apparait(['#place-a', '#place-b'], cue('voient'))
const tAchat = cue('achètent')
son('feutre', tAchat - 0.05)  // les deux flèches, lancées ensemble : un seul bruit
for (const f of ['#fleche-a', '#fleche-b']) {
  const [ligne, tete] = $$(`${f} path`)
  trace(ligne, tAchat - 0.05, 0.3)
  trace(tete, tAchat + 0.22, 0.12)
}
tl.fromTo('#choc', { opacity: 1, scale: 0.6, svgOrigin: '540 630' }, { scale: 1.15, duration: 0.25, ease: 'back.out(3)', immediateRender: false }, tAchat + 0.3)
tremble(tAchat + 0.3)
const tVerifie = cue('vérifie')
trace($('#ok-a'), tVerifie, 0.3)
trace($('#ok-b'), tVerifie + 0.1, 0.3)
// L'éclat a servi : il s'efface, puis le double glisse tout droit de sous le billet (penché, il frôlerait les flèches).
const tDouble = cue('Deux billets')
disparait('#choc', tDouble - 0.3, 0.25)
tl.fromTo('#double', { opacity: 1, y: 0 }, { y: 110, duration: 0.45, ease: 'back.out(2)', immediateRender: false }, tDouble)

// 3. Relance : le schéma revient à zéro.
disparait(['#double', '#choc', '#fleche-a', '#fleche-b', '#place-a', '#place-b', '#ok-a', '#ok-b'], R[2].debut)

// 4. Solution : même schéma, avec un verrou.
const tVerrou = cue('verrou')
colle('#cadenas-ouvert', tVerrou - 0.1)
// Le cadenas se ferme : l'image fermée remplace l'ouverte, avec un petit claquement.
tl.set('#cadenas-ouvert', { opacity: 0 }, tVerrou + 0.45)
son('claque', tVerrou + 0.45)
tl.fromTo('#cadenas-ferme', { opacity: 1, scale: 1.12, transformOrigin: '50% 100%' }, { scale: 1, duration: 0.25, ease: 'back.out(3)', immediateRender: false }, tVerrou + 0.45)
const tAlice = cue('Alice achète')
const [ligneA, teteA] = $$('#achat-a path')
son('feutre', tAlice)
trace(ligneA, tAlice, 0.3)
trace(teteA, tAlice + 0.27, 0.12)
const tAttend = cue('Bob attend')
son('feutre', tAttend)
tl.fromTo('#attente-b', { opacity: 1, scaleX: 0, svgOrigin: '703 630' }, { scaleX: 1, duration: 0.4, ease: 'power1.out', immediateRender: false }, tAttend)
apparait('#complet', cue('complet') - 0.05)

// 5. À retenir : le cadenas claque une dernière fois, sans texte ajouté.
const tFin = cue('verrou')
son('claque', tFin)
tl.fromTo('#cadenas-ferme', { scale: 1.15 }, { scale: 1, duration: 0.3, ease: 'back.out(3)', immediateRender: false }, tFin)

// Carte de fin, commune à toutes les vidéos : le schéma, le titre et la mascotte s'effacent, puis sa voix off dit « Like, et
// abonne-toi ! » (sons/fin-<mascotte>.mp3) : le cœur se colle sur « Like », l'abonnement sur « abonne », seuls au milieu de la feuille.
function carteDeFin(at) {
  disparait(['#schema', '#titre', '#souligne', '#mascotte'], at, 0.35)
  const voix = at + 0.5 - VOIX_FIN.like
  son(`fin-${MASCOTTE}`, voix, 1)
  colle(['#coeur', '#j-aime'], at + 0.5)
  colle(['#abonne', '#abonne-toi'], voix + VOIX_FIN.abonne)
  return voix + VOIX_FIN.fin
}
const FIN = carteDeFin(ALIGN.end + 0.4) + 1.5
tl.set({}, {}, FIN)

// Pose de la mascotte selon qui parle : avec le bâton quand elle parle, sans bâton quand l'élève parle ; la bouche reste fermée.
const POSES = [[0, 'neutre'], ...R.map(r => [Math.max(0, r.debut - 0.1), r.qui === MASCOTTE ? 'pointe' : 'neutre'])]
  .filter((p, i, toutes) => i === 0 || p[1] !== toutes[i - 1][1])  // seulement les vrais changements de pose
// Quand elle parle, un petit saut façon Wankil, d'après l'horodatage lettre par lettre de la voix : sur chaque syllabe
// qui suit la précédente de 0,22 s au moins, pour marquer le rythme sans faire vibrer la mascotte.
const VOYELLE = /[aeiouyàâäéèêëîïôöùûü]/i
const SAUTS = []
for (const r of R.filter(r => r.qui === MASCOTTE)) {
  let balise = false  // [sighs], [deadpan] : pas prononcés
  let avant = -Infinity
  for (let i = r.de; i < r.a; i++) {
    const c = ALIGN.text[i]
    if (c === '[') balise = true
    if (!balise && VOYELLE.test(c) && !VOYELLE.test(ALIGN.text[i - 1] ?? '')) {
      if (ALIGN.t[i] - avant >= 0.22) SAUTS.push(ALIGN.t[i])
      avant = ALIGN.t[i]
    }
    if (c === ']') balise = false
  }
}
// Hauteur du saut en cours, de 0 à 1 et retour en 0,18 s.
function saut(t) {
  const a = SAUTS.findLast(a => a <= t)
  const p = a === undefined ? 1 : (t - a) / 0.18
  return p < 1 ? Math.sin(Math.PI * p) : 0
}

const images = Object.fromEntries($$('#mascotte img').map(i => [i.dataset.pose, i]))
let visible = null
function majMascotte(t) {
  let i = 0
  while (i + 1 < POSES.length && POSES[i + 1][0] <= t) i++
  const [debutPose, pose] = POSES[i]
  if (pose !== visible) {
    if (visible) images[visible].style.visibility = 'hidden'
    images[pose].style.visibility = 'visible'
    visible = pose
  }
  // Petit rebond au changement de pose, respiration lente, et les sauts quand elle parle.
  const rebond = 1 + 0.035 * Math.max(0, 1 - (t - debutPose) / 0.18)
  const h = pose === 'pointe' ? saut(t) : 0
  gsap.set('#mascotte', { y: -14 * h, scaleX: rebond * (1 - 0.015 * h), scaleY: rebond * (1 + 0.008 * Math.sin(t * 2.1) + 0.03 * h) })
}
// Sous-titres : la voix, balises de jeu retirées, phrase par phrase (coupées après . ? ! … :). Une phrase de plus de
// ST_MAX signes se coupe en deux, après une virgule si possible, sinon au plus près du milieu.
// Chaque morceau s'affiche de son premier mot au morceau suivant, et s'éteint à la fin de sa réplique.
const ST_MAX = 33  // deux lignes de 76 px dans la colonne des sous-titres
const ST = []
const longueur = mots => mots.map(m => m.w).join(' ').length
function coupe(mots) {
  if (mots.length < 2 || longueur(mots) <= ST_MAX) return [mots]
  const ecart = j => Math.abs(longueur(mots.slice(0, j)) - longueur(mots.slice(j))) - (mots[j - 1].w.endsWith(',') ? 12 : 0)
  let k = 1
  for (let j = 2; j < mots.length; j++) if (ecart(j) < ecart(k)) k = j
  return [...coupe(mots.slice(0, k)), ...coupe(mots.slice(k))]
}
for (const r of R) {
  const mots = []
  let avant = ''  // un « isolé attend le mot qui le suit
  for (const m of ALIGN.text.slice(r.de, r.a).matchAll(/\[[^\]]*\]|\S+/g)) {
    const w = m[0], t = ALIGN.t[r.de + m.index]
    if (w.startsWith('[')) continue
    if (/[\p{L}\d]/u.test(w)) mots.push({ w: avant + w, t }), avant = ''
    else if (w.startsWith('«')) avant = w + '\u00a0'
    else if (mots.length) mots.at(-1).w += '\u00a0' + w  // ? : » collés au mot d'avant
  }
  const morceaux = []
  let phrase = []
  for (const m of mots) {
    phrase.push(m)
    if (/[.?!…:]$/.test(m.w)) morceaux.push(...coupe(phrase)), phrase = []
  }
  if (phrase.length) morceaux.push(...coupe(phrase))
  morceaux.forEach((m, k) => ST.push({ texte: m.map(x => x.w).join(' '), de: m[0].t, a: morceaux[k + 1]?.[0].t ?? r.fin }))
}
const st = $('#st span')
function majST(t) {
  const texte = ST.find(s => s.de <= t && t < s.a)?.texte ?? ''
  if (st.textContent !== texte) st.textContent = texte
}
window.seekTo = t => { tl.seek(t); majMascotte(t); majST(t) }

// Les autocollants du schéma (<image> SVG) se chargent aussi avant la première image capturée.
Promise.all([document.fonts.load('40px Handlee'), ...$$('img').map(i => i.decode()),
  ...$$('image').map(i => Object.assign(new Image(), { src: i.href.baseVal }).decode())])
  .then(() => document.fonts.ready)
  .then(() => {
    window.seekTo(0)
    window.ready = true
    if (location.search.includes('render')) return
    const fit = () => $('#stage').style.transform = `scale(${Math.min(innerWidth / 1080, innerHeight / 1920)})`
    fit(); addEventListener('resize', fit)
    const play = $('#play'), vo = $('#vo')
    play.style.display = 'grid'
    play.onclick = () => { play.style.display = 'none'; vo.currentTime = 0; vo.play(); tl.restart() }
    gsap.ticker.add(() => { majMascotte(tl.time()); majST(tl.time()) })
  })
</script>
</body>
</html>
