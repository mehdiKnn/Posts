<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race condition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Handlee&display=block" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="voix-align.js"></script>
<style>
/* Charte : .claude/skills/video-courte/charte.md (palette « Feutres », Handlee, feuille à petits carreaux) */
:root{
  --feuille:#FBFBF8; --quadrillage:#A9C7E8; --encre:#1C1C21;
  --bleu:#2356D8; --rouge:#E2372C; --vert:#1E9C57; --surligneur:#FFE04A;
  --main:'Handlee','Comic Sans MS',cursive;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--feuille)}
body{display:grid;place-items:center;min-height:100vh;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;flex:none;color:var(--encre);font-family:var(--main);
  background-color:var(--feuille);
  background-image:linear-gradient(var(--quadrillage) 2px,transparent 2px),linear-gradient(90deg,var(--quadrillage) 2px,transparent 2px);
  background-size:54px 54px;background-position:-1px -1px}
#cam{position:absolute;inset:0}
#play{display:none;position:fixed;inset:0;place-items:center;background:rgba(251,251,248,.85);font:28px var(--main);cursor:pointer;z-index:10}

#titre{position:absolute;left:0;right:0;top:248px;text-align:center;font-size:104px;line-height:1.1;clip-path:inset(0 100% 0 0)}
.ecran{position:absolute;width:194px;text-align:center;font-size:54px;line-height:1;opacity:0}
.ecran.vert{color:var(--vert)}
#mot{position:absolute;left:539px;top:930px;font-size:100px;line-height:1;clip-path:inset(0 100% 0 0)}
#mot span{position:relative;z-index:1}
#mot i{position:absolute;left:-12px;right:-12px;top:22%;bottom:4%;background:var(--surligneur);border-radius:10px;transform-origin:left;transform:scaleX(0)}

svg{position:absolute;inset:0;width:1080px;height:1920px;overflow:visible}
.trait{fill:none;stroke:var(--encre);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.plein{fill:#FFFFFF;fill-opacity:0}
.bleu{stroke:var(--bleu)} .rouge{stroke:var(--rouge)} .vert{stroke:var(--vert)}
.cache{opacity:0}

/* Le schéma, agrandi et descendu ; la taupe en bas à gauche (560 px de haut, pieds à 1550 px). */
#schema{position:absolute;inset:0;transform-origin:540px 630px;transform:translateY(70px) scale(1.12)}
#taupe{position:absolute;left:-198px;top:918px;width:1000px;height:650px;transform-origin:50% 94%}
#taupe img{position:absolute;inset:0;width:100%;height:100%;visibility:hidden}
</style>
</head>
<body>
<div id="stage">
  <div id="cam">
    <div id="titre">Race condition</div>

    <svg viewBox="0 0 1080 1920"><path id="souligne" class="trait bleu" d="M300 386 C420 378 620 392 782 382"/></svg>

    <div id="schema">
    <svg viewBox="0 0 1080 1920">

      <!-- Téléphones d'Alice (gauche) et de Bob (droite) -->
      <g id="tel-a">
        <rect class="trait plein" x="130" y="450" width="230" height="360" rx="32"/>
        <rect class="trait" x="148" y="500" width="194" height="250" rx="10"/>
        <circle class="trait" cx="245" cy="782" r="9"/>
      </g>
      <g id="tel-b">
        <rect class="trait plein" x="720" y="450" width="230" height="360" rx="32"/>
        <rect class="trait" x="738" y="500" width="194" height="250" rx="10"/>
        <circle class="trait" cx="835" cy="782" r="9"/>
      </g>
      <circle id="tap-a" class="trait bleu cache" cx="245" cy="625" r="40"/>
      <circle id="tap-b" class="trait bleu cache" cx="835" cy="625" r="40"/>
      <path id="ok-a" class="trait vert" d="M215 690 L238 712 L278 668"/>
      <path id="ok-b" class="trait vert" d="M805 690 L828 712 L868 668"/>

      <!-- Le billet, et son double rouge qui sort de derrière -->
      <g id="double" class="cache"><path class="trait rouge" style="fill:#FDECEA" d="M455 575 H625 V610 A20 20 0 0 0 625 650 V685 H455 V650 A20 20 0 0 0 455 610 Z"/></g>
      <g id="billet">
        <path class="trait plein" d="M455 575 H625 V610 A20 20 0 0 0 625 650 V685 H455 V650 A20 20 0 0 0 455 610 Z"/>
        <path id="etoile" class="trait bleu" d="M540 604 L548 622 L567 623 L552 635 L557 654 L540 643 L523 654 L528 635 L513 623 L532 622 Z"/>
      </g>

      <!-- Les deux achats -->
      <g id="fleche-a"><path class="trait bleu" d="M368 630 H440"/><path class="trait bleu tete" d="M424 614 L442 630 L424 646"/></g>
      <g id="fleche-b"><path class="trait bleu" d="M712 630 H640"/><path class="trait bleu tete" d="M656 614 L638 630 L656 646"/></g>
      <g id="choc" class="cache">
        <path class="trait rouge" d="M540 548 V522"/><path class="trait rouge" d="M500 556 L486 536"/><path class="trait rouge" d="M580 556 L594 536"/>
        <path class="trait rouge" d="M540 712 V738"/><path class="trait rouge" d="M500 704 L486 724"/><path class="trait rouge" d="M580 704 L594 724"/>
      </g>

      <!-- La solution : le verrou, Alice passe, Bob attend -->
      <g id="verrou" class="cache">
        <path id="anse" class="trait vert" d="M524 529 V513 A16 16 0 0 1 556 513 V529"/>
        <rect class="trait vert" x="512" y="527" width="56" height="44" rx="8" style="fill:#E3F4EA"/>
      </g>
      <g id="achat-a"><path class="trait vert" d="M368 630 H440"/><path class="trait vert tete" d="M424 614 L442 630 L424 646"/></g>
      <path id="attente-b" class="trait bleu cache" d="M712 630 H668" style="stroke-dasharray:12 12"/>
    </svg>

    <div class="ecran" id="place-a" style="left:148px;top:598px">1 place</div>
    <div class="ecran" id="place-b" style="left:738px;top:598px">1 place</div>
    <div class="ecran vert" id="complet" style="left:738px;top:598px">complet</div>
    </div>
    <div id="mot"><i></i><span>verrou</span></div>

    <div id="taupe">
      <img data-pose="neutre" src="../../mascottes/taupe/sprites/neutre.png" alt="">
      <img data-pose="pointe-fermee" src="../../mascottes/taupe/sprites/pointe-fermee.png" alt="">
      <img data-pose="pointe-ouverte" src="../../mascottes/taupe/sprites/pointe-ouverte.png" alt="">
    </div>
  </div>
</div>
<div id="play">▶ Cliquer pour lancer (avec le son)</div>
<audio id="vo" src="voix.mp3" preload="auto"></audio>

<script>
const $ = s => document.querySelector(s)
const $$ = s => [...document.querySelectorAll(s)]
const tl = gsap.timeline({ paused: true })
window.tl = tl

// Instant où la voix prononce `p` ; les repères se demandent dans l'ordre du texte.
let curseur = 0
window.REPERES = []  // chaque repère et son instant : les contrôles (render.mjs controle, verifier.mjs) les lisent
function cue(p) {
  const i = ALIGN.text.indexOf(p, curseur)
  if (i < 0) throw new Error('Repère introuvable dans la voix : ' + p)
  curseur = i + p.length
  REPERES.push({ mot: p, i, t: ALIGN.t[i] })
  return ALIGN.t[i]
}
const R = ALIGN.repliques  // 0 élève, 1 taupe (mécanisme), 2 élève (relance), 3 taupe (solution), 4 taupe (à retenir)

// Un trait se dessine comme au feutre.
function trace(el, at, duree = 0.5) {
  const L = el.getTotalLength()
  // Le trou du pointillé dépasse le trait, sinon son bout arrondi laisse un point visible avant le tracé.
  gsap.set(el, { strokeDasharray: `${L} ${L + 20}`, strokeDashoffset: L + 10 })
  tl.to(el, { strokeDashoffset: 0, duration: duree, ease: 'power1.inOut' }, at)
}
const traceTout = (g, at, duree) => g.querySelectorAll('path, rect, circle').forEach((el, i) => trace(el, at + i * 0.12, duree))
const apparait = (el, at, d = 0.3) => tl.to(el, { opacity: 1, duration: d, ease: 'power1.out' }, at)
const disparait = (els, at, d = 0.35) => tl.to(els, { opacity: 0, duration: d, ease: 'power1.in' }, at)
const ecrit = (el, at, d = 0.7) => tl.to(el, { clipPath: 'inset(0 0% 0 0)', duration: d, ease: 'none' }, at)
const tremble = at => tl.to('#cam', { keyframes: { x: [0, -14, 12, -8, 5, 0] }, duration: 0.4, ease: 'none' }, at)

// 1. Question : le sujet s'écrit sur la feuille.
ecrit('#titre', 0.2)
trace($('#souligne'), 0.95, 0.45)

// 2. Mécanisme : le billet, les deux téléphones, la collision.
const tBillet = cue('Il reste')
traceTout($('#billet'), tBillet - 0.1)
tl.to('#billet .plein', { fillOpacity: 1, duration: 0.2 }, tBillet + 0.3)
for (const [g, mot] of [['#tel-a', 'Alice'], ['#tel-b', 'Bob']]) {
  const t = cue(mot)
  traceTout($(g), t - 0.1, 0.45)
  tl.to(`${g} .plein`, { fillOpacity: 1, duration: 0.2 }, t + 0.3)
}
const tClic = cue('cliquent')
for (const tap of ['#tap-a', '#tap-b']) tl.fromTo(tap, { opacity: 1, scale: 0.3, transformOrigin: '50% 50%' }, { opacity: 0, scale: 1.6, duration: 0.6, ease: 'power2.out', immediateRender: false }, tClic)
apparait(['#place-a', '#place-b'], cue('voient'))
const tAchat = cue('achètent')
for (const f of ['#fleche-a', '#fleche-b']) {
  const [ligne, tete] = $$(`${f} path`)
  trace(ligne, tAchat - 0.05, 0.3)
  trace(tete, tAchat + 0.22, 0.12)
}
tl.fromTo('#choc', { opacity: 1, scale: 0.6, svgOrigin: '540 630' }, { scale: 1.15, duration: 0.25, ease: 'back.out(3)', immediateRender: false }, tAchat + 0.3)
tremble(tAchat + 0.3)
const tVerifie = cue('vérifie')
trace($('#ok-a'), tVerifie, 0.3)
trace($('#ok-b'), tVerifie + 0.1, 0.3)
const tDouble = cue('Deux billets')
tl.fromTo('#double', { opacity: 1, x: 0, y: 0, rotation: 0, svgOrigin: '540 630' }, { x: 70, y: 70, rotation: 9, duration: 0.45, ease: 'back.out(2)', immediateRender: false }, tDouble)

// 3. Relance : le schéma revient à zéro.
disparait(['#double', '#choc', '#fleche-a', '#fleche-b', '#place-a', '#place-b', '#ok-a', '#ok-b'], R[2].debut)

// 4. Solution : même schéma, avec un verrou.
const tVerrou = cue('verrou')
tl.set('#verrou', { opacity: 1 }, tVerrou - 0.1)
traceTout($('#verrou'), tVerrou - 0.1, 0.35)
tl.fromTo('#anse', { y: -14 }, { y: 0, duration: 0.25, ease: 'back.out(3)' }, tVerrou + 0.45)  // le cadenas se ferme
const tAlice = cue('Alice achète')
const [ligneA, teteA] = $$('#achat-a path')
trace(ligneA, tAlice, 0.3)
trace(teteA, tAlice + 0.27, 0.12)
const tAttend = cue('Bob attend')
tl.fromTo('#attente-b', { opacity: 1, scaleX: 0, svgOrigin: '712 630' }, { scaleX: 1, duration: 0.4, ease: 'power1.out', immediateRender: false }, tAttend)
apparait('#complet', cue('complet') - 0.05)

// 5. À retenir : le mot-clé, surligné, sous la baguette.
const tMot = cue('verrou')
ecrit('#mot', tMot - 0.1, 0.45)
tl.to('#mot i', { scaleX: 1, duration: 0.35, ease: 'power1.inOut' }, tMot + 0.3)

const FIN = ALIGN.end + 1.5
tl.set({}, {}, FIN)

// Pose de la taupe selon qui parle : avec le bâton quand elle parle (la bouche suit la voix), bouche fermée sans bâton quand l'élève parle.
const POSES = [[0, 'neutre'], ...R.map(r => [Math.max(0, r.debut - 0.1), r.qui === 'taupe' ? 'pointe' : 'neutre'])]
  .filter((p, i, toutes) => i === 0 || p[1] !== toutes[i - 1][1])  // seulement les vrais changements de pose
// Bouche quand elle parle : une ouverture par syllabe, d'après l'horodatage lettre par lettre de la voix.
// Ouverte 60 % du temps jusqu'à la syllabe suivante, au moins 2 images ouverte puis 2 fermée (sinon la syllabe saute).
const VOYELLE = /[aeiouyàâäéèêëîïôöùûü]/i
const BOUCHE = []
for (const r of R.filter(r => r.qui === 'taupe')) {
  const syllabes = []
  let balise = false  // [sighs], [deadpan] : pas prononcés
  for (let i = r.de; i < r.a; i++) {
    const c = ALIGN.text[i]
    if (c === '[') balise = true
    if (!balise && VOYELLE.test(c) && !VOYELLE.test(ALIGN.text[i - 1] ?? '')) syllabes.push(ALIGN.t[i])
    if (c === ']') balise = false
  }
  syllabes.forEach((d, k) => {
    if (BOUCHE.length && d < BOUCHE.at(-1)[1] + 0.067) return
    const suivante = syllabes[k + 1] ?? d + 0.3
    BOUCHE.push([d, d + Math.min(0.16, Math.max(0.067, 0.6 * (suivante - d)))])
  })
}
const boucheOuverte = t => BOUCHE.some(([a, b]) => a <= t && t < b)

const images = Object.fromEntries($$('#taupe img').map(i => [i.dataset.pose, i]))
let visible = null
function majTaupe(t) {
  let i = 0
  while (i + 1 < POSES.length && POSES[i + 1][0] <= t) i++
  const [debutPose, pose] = POSES[i]
  const image = pose === 'pointe' ? (boucheOuverte(t) ? 'pointe-ouverte' : 'pointe-fermee') : pose
  if (image !== visible) {
    if (visible) images[visible].style.visibility = 'hidden'
    images[image].style.visibility = 'visible'
    visible = image
  }
  // Petit rebond au changement de pose, et respiration lente.
  const rebond = 1 + 0.035 * Math.max(0, 1 - (t - debutPose) / 0.18)
  gsap.set('#taupe', { scaleX: rebond, scaleY: rebond * (1 + 0.008 * Math.sin(t * 2.1)) })
}
window.seekTo = t => { tl.seek(t); majTaupe(t) }

Promise.all([document.fonts.load('40px Handlee'), ...$$('img').map(i => i.decode())])
  .then(() => document.fonts.ready)
  .then(() => {
    window.seekTo(0)
    window.ready = true
    if (location.search.includes('render')) return
    const fit = () => $('#stage').style.transform = `scale(${Math.min(innerWidth / 1080, innerHeight / 1920)})`
    fit(); addEventListener('resize', fit)
    const play = $('#play'), vo = $('#vo')
    play.style.display = 'grid'
    play.onclick = () => { play.style.display = 'none'; vo.currentTime = 0; vo.play(); tl.restart() }
    gsap.ticker.add(() => majTaupe(tl.time()))
  })
</script>
</body>
</html>
